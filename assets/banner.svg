<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="puente-nube — puente nube ↔ local">
  <defs>
    <linearGradient id="almagre" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C14B38"/>
      <stop offset="0.55" stop-color="#8E3022"/>
      <stop offset="1" stop-color="#6E2418"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3D27A"/>
      <stop offset="0.5" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#9A7A16"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="url(#almagre)"/>
  <rect width="1280" height="400" fill="url(#glass)"/>
  <ellipse cx="320" cy="60" rx="420" ry="150" fill="#ffffff" opacity="0.08" filter="url(#blur)"/>
  <ellipse cx="1050" cy="360" rx="360" ry="140" fill="#000000" opacity="0.10" filter="url(#blur)"/>

  <!-- emblema a la izquierda, girado -->
  <g transform="translate(70 40) rotate(-16 160 160)" filter="url(#soft)">
    <rect x="40" y="130" width="96" height="78" rx="15" fill="#1c0f0c" opacity="0.72" stroke="url(#oro)" stroke-width="3"/>
    <path d="M58 158 l19 13 -19 13" fill="none" stroke="url(#oro)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="90" y1="188" x2="116" y2="188" stroke="url(#oro)" stroke-width="6.5" stroke-linecap="round"/>
    <g fill="url(#glass)" stroke="url(#oro)" stroke-width="3">
      <path d="M250 210 h86 a32 32 0 0 0 6 -63 a41 41 0 0 0 -79 -13 a28 28 0 0 0 -13 54 z"/>
    </g>
    <path d="M88 210 Q190 112 290 210" fill="none" stroke="url(#oro)" stroke-width="9" stroke-linecap="round"/>
    <line x1="88" y1="210" x2="290" y2="210" stroke="url(#oro)" stroke-width="5.5" stroke-linecap="round"/>
    <g stroke="url(#oro)" stroke-width="3.5" opacity="0.9">
      <line x1="126" y1="210" x2="126" y2="180"/><line x1="164" y1="210" x2="164" y2="156"/>
      <line x1="190" y1="210" x2="190" y2="148"/><line x1="216" y1="210" x2="216" y2="156"/>
      <line x1="254" y1="210" x2="254" y2="180"/>
    </g>
  </g>

  <!-- título -->
  <text x="520" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="74" fill="url(#oro)" letter-spacing="2">puente-nube</text>
  <text x="522" y="222" font-family="Georgia, serif" font-size="27" fill="#ffffff" opacity="0.9">Puente nube ↔ local · coordinación por GitHub</text>
  <line x1="522" y1="248" x2="1120" y2="248" stroke="url(#oro)" stroke-width="2" opacity="0.6"/>
  <text x="522" y="292" font-family="Georgia, serif" font-size="21" fill="#ffffff" opacity="0.72">La nube y las sesiones locales se hablan solas; nada se despliega sin la aprobación del titular.</text>

  <text x="1210" y="360" text-anchor="end" font-family="Georgia, serif" font-size="30" fill="url(#oro)" letter-spacing="4">SHANIA<tspan font-size="14" dy="-14">™</tspan></text>
</svg>
